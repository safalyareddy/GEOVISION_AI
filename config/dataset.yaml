# GeoVision AI — Satellite Dataset Configuration

dataset:
  raw_dir: "dataset/raw"
  prepared_dir: "dataset/prepared"
  image_dir_name: "images"
  mask_dir_name: "masks"
  supported_extensions:
    - ".png"
    - ".jpg"
    - ".jpeg"
    - ".tif"
    - ".tiff"
  splits:
    train_ratio: 0.70
    val_ratio: 0.15
    test_ratio: 0.15
    seed: 42
